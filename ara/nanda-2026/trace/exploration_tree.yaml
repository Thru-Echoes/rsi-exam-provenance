tree:
  - id: N01
    type: question
    support_level: explicit
    source_refs: ["README.md:5-23"]
    title: Audit the decisions that create later lineage
    description: How can keep-or-revert decisions in a self-improving-agent rollout be checked offline against exact artifacts and evidence?
    children:
      - id: N02
        type: experiment
        support_level: explicit
        source_refs: ["tests/test_rsi_exam_provenance.py", "docs/overview.md:157-173"]
        title: Bind and fault-test a portable decision record
        result: The producer, verifier, fixtures, and fault-injection tests expose separate integrity, protocol, and coverage outcomes.
        evidence: [C01]
        children:
          - id: N03
            type: decision
            support_level: explicit
            source_refs: ["README.md:44-49", "docs/overview.md:329-338"]
            title: Exclude private reasoning and bind only audit inputs
            choice: Record numbers, identifiers, dispositions, evidence locations, and digests; do not capture prompts, transcripts, or reasoning.
            alternatives:
              - Capture a full interaction trace
              - Preserve only the final method and reward
            evidence: [C01]
          - id: N04
            type: experiment
            support_level: explicit
            source_refs: ["docs/PREFLIGHT.md:237-278", "docs/PREFLIGHT.md:356-360"]
            title: Apply the producer and verifier to observed cohorts
            result: Native logs include missing and structurally unstable cases; instrumented paths yield verified records or explicit refusals.
            evidence: [C02]
      - id: N05
        type: question
        support_level: explicit
        source_refs: ["docs/campaign/2026-09-instrument-ab/manifest.md:78-113"]
        title: Test whether the decision instrument improves the endpoint
        description: Does the instrument improve final sealed reward relative to a helper that records provenance without the gate policy?
        children:
          - id: N06
            type: experiment
            support_level: explicit
            source_refs:
              - "docs/shadow-audit/instrument-ab/haiku/endpoints.md:21"
              - "docs/shadow-audit/instrument-ab/sonnet/endpoints.md:18"
              - "docs/shadow-audit/pilots/pilot-8-preregistration.md:5-6"
              - "ara/nanda-2026/evidence/results/paper-results.json"
            title: Run the blocked comparison stages
            result: The generated ten-block direction count is 3 instrument-favoring and 7 helper-favoring; Opus block 1 is bound by committed capsule reward digests, while blocks 2 and 3 remain recoverable only from a rounded committed pre-probe summary and secondary tables remain missing from the merged tree.
            evidence: [C03]
            children:
              - id: N07
                type: pivot
                support_level: inferred
                source_refs:
                  - "docs/overview.md:329-338"
                  - "ara/nanda-2026/evidence/results/reconciliation-status.md"
                title: Center the paper on auditability rather than a positive reward result
                from: A paper whose headline success depends on gate efficacy
                to: A paper about offline-verifiable decision provenance with an unsupported efficacy claim
                trigger: The reconciled endpoint tables do not support improvement, while the provenance mechanism remains testable.
                children:
                  - id: N08
                    type: decision
                    support_level: inferred
                    source_refs: ["ara/nanda-2026/evidence/results/reconciliation-status.md"]
                    title: Make reconciliation a release gate
                    choice: Preserve evidence class per row, use digest-bound capsule rewards where present, use the rounded Opus summary only for the remaining directions, and block exact aggregate or secondary claims until the missing receipts and tables are committed and hashed.
                    alternatives:
                      - Treat every narrative aggregate as equivalent to a generated table
                      - Omit the incomplete stage without disclosure
                    evidence: [C03]
              - id: N09
                type: question
                support_level: explicit
                source_refs:
                  - "docs/campaign/2026-09-instrument-ab/manifest.md:133-137"
                  - "docs/PREFLIGHT.md:581-600"
                title: Is the confirmation limit a mechanism for later suppression?
                description: Would varying the confirmation cap while holding candidate evidence and compute fixed change later selection behavior?
                children: []
  - id: N10
    type: pivot
    support_level: explicit
    attribution: user-revised
    source_refs: ["ara/nanda-2026/REVIEW.md"]
    title: Replace reward-centered evaluation with a direct audit question
    description: Human critique identified that artifact formatting and reward outcomes did not establish a coherent auditability contribution.
    children:
      - id: N11
        type: experiment
        support_level: explicit
        attribution: ai-executed
        source_refs: ["studies/decision-audit/development-results.json"]
        title: Separate refusal from the intended diagnostic
        result: One development case is stopped by a missing version before the intended ancestry verifier check.
        evidence: [C01]
      - id: N12
        type: experiment
        support_level: explicit
        attribution: ai-executed
        source_refs: ["studies/decision-audit/fault-results.json"]
        title: Characterize incremental checks and accepted rewrites
        result: Six authored faults survive bindings but fail full checks; a consistent unsigned reward rewrite passes. One of nine diagnostic expectations mismatches.
        evidence: [C05, C06]

  - id: N13
    type: experiment
    support_level: explicit
    attribution: ai-executed
    source_refs: ["studies/handoff-case-review/case-results.json"]
    title: Inspect real retained evidence without inventing missing inputs
    result: RSI branch and log binding recoverable; raw per-seed and snapshot evidence absent. Harvey historical extraction is information-asymmetric and not a current verifier trial.
    evidence: [C07, C08]
  - id: N14
    type: pivot
    support_level: explicit
    attribution: ai-suggested
    source_refs: ["ara/nanda-2026/evidence/reader-review-2026-09-17.md"]
    title: Rebuild the narrative around a recipient checking one version decision
    description: Human author reported confusion. Replace unused notation with a worked fixture sequence; move unrelated historical studies to the companion. No empirical result changed and readability improvement is not measured.
    evidence: [C01, C05, C06]
  - id: N15
    type: decision
    support_level: explicit
    attribution: user-requested-ai-executed
    source_refs: ["ara/nanda-2026/evidence/reader-review-2026-09-17.md"]
    title: Explain why selection decisions matter across an artifact handoff
    description: Lead with later work inheriting keep decisions; separate capture, consistency checking and admission. Update PR and Notion while retaining unchanged experiment outcomes and the old frozen archive. No network deployment is claimed.
    evidence: [C01, C05, C06]
  - id: N16
    type: pivot
    support_level: explicit
    attribution: user-requested-ai-executed
    source_refs: ["ara/nanda-2026/evidence/framework-review-2026-09-17.md"]
    title: Make capture-verify-govern the framework and RSI its first instantiation
    description: Separate design contribution from Verify characterization; specify boundary contract and disclose absent mandatory receipt binding and approved handoff. No whole-framework validation claim.
    evidence: [C09]
  - id: N17
    type: experiment
    support_level: explicit
    attribution: ai-executed
    source_refs: ["studies/framework-boundary/results.json", "studies/framework-boundary/README.md"]
    title: Exercise evidence-only intake and unadmitted candidate boundaries
    result: Three decisions import as evidence without claims or admissions. Existing numerical fault fails full verification but remains first-importable. Explicit candidate has no governed context. Same-identity overwrite is correctly refused; no human approval is invoked.
    evidence: [C09, C10]

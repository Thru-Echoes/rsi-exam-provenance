<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 587" width="1200" height="587" role="img" aria-label="Without the gate: the same model and window, the agent deciding alone."><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-agent:#6b6a63;--c-sealed:#C2731B;--c-within:#78776f;--c-version:#52514e;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-agent:#a3a29a;--c-sealed:#e39a4a;--c-within:#93928a;--c-version:#c3c2b7;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}</style><rect width="1200" height="587" fill="var(--surface)"/><text x="44.0" y="72.0" font-size="26" font-weight="700" fill="var(--ink)">Without the gate: the same model and window, the agent deciding alone.</text><text x="44.0" y="100.0" font-size="13.5" fill="var(--ink2)">claude-opus-5 under the helper alone, no gate, 2026-09-10. The trial paired with the instrument's in the same block. The helper records</text><text x="44.0" y="119.0" font-size="13.5" fill="var(--ink2)">every version and decision. Nothing rules on a keep.</text><text x="44" y="150" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">HOW TO READ THIS</text><text x="44.0" y="170.0" font-size="12.5" fill="var(--ink)">1  The agent writes a new version, scores it on the 8 public seeds, and keeps it on its own.</text><text x="44.0" y="188.0" font-size="12.5" fill="var(--ink)">2  The helper writes the decision down. Nothing checks it during the run.</text><text x="44.0" y="206.0" font-size="12.5" fill="var(--ink)">3  The hidden seeds, scored later, say whether each keep was right.</text><rect x="44" y="222" width="300" height="305" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.25"/><text x="64" y="250" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">ONE REAL ROLLOUT</text><text x="64.0" y="274.0" font-size="14" font-weight="650" fill="var(--ink)">Opus trial, helper only</text><text x="64.0" y="298.0" font-size="12" fill="var(--ink2)">claude-opus-5 · 2026-09-10</text><text x="64.0" y="315.0" font-size="12" fill="var(--ink2)">the helper alone, no gate</text><text x="64.0" y="332.0" font-size="12" fill="var(--ink2)">32-minute window</text><line x1="64" y1="361" x2="324" y2="361" stroke="var(--line)"/><text x="64" y="381" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">IN NUMBERS</text><text x="64.0" y="407.0" font-size="12" fill="var(--ink)">decisions the agent made</text><text x="324.0" y="407.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="431.0" font-size="12" fill="var(--ink)">kept or submitted</text><text x="324.0" y="431.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="455.0" font-size="12" fill="var(--ink)">reverted</text><text x="324.0" y="455.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">0</text><text x="64.0" y="479.0" font-size="12" fill="var(--ink)">checked during the run</text><text x="324.0" y="479.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">0</text><text x="64.0" y="503.0" font-size="12" fill="var(--ink)">record verified offline</text><text x="324.0" y="503.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">yes</text><line x1="374" y1="222" x2="374" y2="320" stroke="var(--line)" stroke-width="2"/><text x="44.0" y="557.0" font-size="11.5" fill="var(--ink3)">Every row is an event from the rollout's own files, the record built after the run and the helper's log. The hidden-seed column joins once the sealed</text><text x="44.0" y="572.0" font-size="11.5" fill="var(--ink3)">retrospective of this stage has run.</text><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="374" cy="243" r="6.5" fill="var(--surface)" stroke="var(--c-keep)" stroke-width="3"/><g><rect x="400.0" y="236" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="248" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v1</text></g><g><rect x="437.2" y="236" width="174.4" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="248" font-size="11" font-weight="650" fill="var(--c-agent)">agent decides: submitted</text></g><text x="621.6" y="248.0" font-size="12" fill="var(--ink)">bitboard expectimax (nneonneo…</text><text x="400.0" y="265.0" font-size="12" fill="var(--ink2)">parent v0 · scores 91,500 on the public seeds (parent 2,060)</text><g><rect x="870.6" y="236" width="75.4" height="18" rx="9.0" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6" stroke-width="1"/><text x="878.6" y="248" font-size="11" font-weight="650" fill="var(--c-keep)">SUBMITTED</text></g></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="960.0" y="312.0" font-size="12" font-weight="650" fill="var(--ink)">submitted: v1</text><text x="960.0" y="328.0" font-size="12" font-weight="650" fill="var(--ink)">exam reward 0.6084</text><text x="960.0" y="344.0" font-size="10.5" fill="var(--ink3)">hidden-seed column: not scored yet</text></g></svg>
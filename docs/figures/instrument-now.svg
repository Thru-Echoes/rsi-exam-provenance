<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 673" width="1200" height="673" role="img" aria-label="Now: the instrument checks every keep during the run."><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-agent:#6b6a63;--c-sealed:#C2731B;--c-within:#78776f;--c-version:#52514e;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-agent:#a3a29a;--c-sealed:#e39a4a;--c-within:#93928a;--c-version:#c3c2b7;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}@keyframes e0{0%,3.56%{opacity:0;transform:translateX(-14px)}6.06%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e1{0%,7.84%{opacity:0;transform:translateX(-14px)}10.33%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e2{0%,12.12%{opacity:0;transform:translateX(-14px)}14.61%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e3{0%,17.11%{opacity:0;transform:translateX(-14px)}19.60%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e4{0%,21.38%{opacity:0;transform:translateX(-14px)}23.88%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e5{0%,25.66%{opacity:0;transform:translateX(-14px)}28.15%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e6{0%,30.65%{opacity:0;transform:translateX(-14px)}33.14%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e7{0%,34.93%{opacity:0;transform:translateX(-14px)}37.42%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e8{0%,34.93%{opacity:0;transform:translateX(-14px)}37.42%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e9{0%,44.90%{opacity:0;transform:translateX(-14px)}47.40%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e10{0%,54.88%{opacity:0;transform:translateX(-14px)}57.38%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e11{0%,56.66%{opacity:0;transform:translateX(-14px)}59.16%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e12{0%,57.80%{opacity:0;transform:translateX(-14px)}60.30%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e13{0%,58.95%{opacity:0;transform:translateX(-14px)}61.44%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}@keyframes e14{0%,64.36%{opacity:0;transform:translateX(-14px)}66.86%,96.44%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-14px)}}</style><rect width="1200" height="673" fill="var(--surface)"/><text x="44.0" y="72.0" font-size="26" font-weight="700" fill="var(--ink)">Now: the instrument checks every keep during the run.</text><text x="44.0" y="100.0" font-size="13.5" fill="var(--ink2)">claude-haiku-4-5 under the instrument, 2026-09-09. The agent still writes the versions and still decides what to try next. What changes is</text><text x="44.0" y="119.0" font-size="13.5" fill="var(--ink2)">that a keep only sticks once it has been measured.</text><text x="44" y="150" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">HOW TO READ THIS</text><text x="44.0" y="170.0" font-size="12.5" fill="var(--ink)">1  The agent writes a new version, scores it on the 8 public seeds, and proposes to keep it.</text><text x="44.0" y="188.0" font-size="12.5" fill="var(--ink)">2  The gate checks the improvement on those seeds, then on fresh seeds the agent never saw.</text><text x="44.0" y="206.0" font-size="12.5" fill="var(--ink)">3  Only a confirmed improvement stays. Every ruling is logged. A safety check runs before submission.</text><rect x="44" y="222" width="300" height="387" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.25"/><text x="64" y="250" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">ONE REAL ROLLOUT</text><text x="64.0" y="274.0" font-size="14" font-weight="650" fill="var(--ink)">Haiku pilot under the instrument</text><text x="64.0" y="298.0" font-size="12" fill="var(--ink2)">claude-haiku-4-5 · 2026-09-09</text><text x="64.0" y="315.0" font-size="12" fill="var(--ink2)">the instrument. helper and gate mounted</text><text x="64.0" y="332.0" font-size="12" fill="var(--ink2)">read-only</text><text x="64.0" y="349.0" font-size="12" fill="var(--ink2)">340-second window. finished on its own</text><text x="64.0" y="366.0" font-size="12" fill="var(--ink2)">at 159 s</text><line x1="64" y1="395" x2="324" y2="395" stroke="var(--line)"/><text x="64" y="415" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">IN NUMBERS</text><text x="64.0" y="441.0" font-size="12" fill="var(--ink)">keeps the agent asked for</text><text x="324.0" y="441.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2</text><text x="64.0" y="465.0" font-size="12" fill="var(--ink)">confirmed on fresh seeds</text><text x="324.0" y="465.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="489.0" font-size="12" fill="var(--ink)">overruled by the gate</text><text x="324.0" y="489.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="513.0" font-size="12" fill="var(--ink)">reverted by the agent itself</text><text x="324.0" y="513.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="537.0" font-size="12" fill="var(--ink)">rulings in the decision log</text><text x="324.0" y="537.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2</text><text x="64.0" y="561.0" font-size="12" fill="var(--ink)">record verified offline</text><text x="324.0" y="561.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">yes</text><text x="64.0" y="585.0" font-size="12" fill="var(--ink)">hidden seeds disagreed</text><text x="324.0" y="585.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2 of 3</text><line x1="374" y1="222" x2="374" y2="603" stroke="var(--line)" stroke-width="2"/><text x="44.0" y="643.0" font-size="11.5" fill="var(--ink3)">Every row is an event from the rollout's own files. The plain line under each ruling is rendered from the recorded fields. The hidden seeds are</text><text x="44.0" y="658.0" font-size="11.5" fill="var(--ink3)">analysis data and never tune the rule.</text><g style="animation:e0 14.03s linear infinite"><circle cx="374" cy="243" r="6.5" fill="var(--surface)" stroke="var(--c-revert)" stroke-width="3"/><g><rect x="400.0" y="236" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="248" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v1</text></g><g><rect x="437.2" y="236" width="148.0" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="248" font-size="11" font-weight="650" fill="var(--c-agent)">agent proposes: keep</text></g><text x="595.2" y="248.0" font-size="12" fill="var(--ink)">heuristic-based move evaluator</text><text x="400.0" y="265.0" font-size="12" fill="var(--ink2)">parent v0 · scores 2,222 on the public seeds (parent 2,060)</text></g><g style="animation:e1 14.03s linear infinite"><g><rect x="400.0" y="274" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="286" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="303.0" font-size="12" fill="var(--ink)">Too close to call on the practice games. Mean +162, range -578 to 1,072 over 8</text><text x="400.0" y="320.0" font-size="12" fill="var(--ink)">games. A confirmation would need 2,046 fresh games. The cap is 16. Reverted.</text></g><g style="animation:e2 14.03s linear infinite"><g><rect x="450.4" y="274" width="260.2" height="18" rx="9.0" fill="var(--c-revert)" fill-opacity="0.13" stroke="var(--c-revert)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="286" font-size="11" font-weight="650" fill="var(--c-revert)">REVERTED · the agent's keep overruled</text></g></g><g style="animation:e3 14.03s linear infinite"><circle cx="374" cy="344" r="6.5" fill="var(--surface)" stroke="var(--c-keep)" stroke-width="3"/><g><rect x="400.0" y="337" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="349" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v2</text></g><g><rect x="437.2" y="337" width="148.0" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="349" font-size="11" font-weight="650" fill="var(--c-agent)">agent proposes: keep</text></g><text x="595.2" y="349.0" font-size="12" fill="var(--ink)">lookahead with revised heuristics</text><text x="400.0" y="366.0" font-size="12" fill="var(--ink2)">parent v0 · scores 4,838 on the public seeds (parent 2,060)</text></g><g style="animation:e4 14.03s linear infinite"><g><rect x="400.0" y="375" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="387" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="404.0" font-size="12" fill="var(--ink)">Better on the practice games. Confirmed on fresh games the agent never saw. Mean</text><text x="400.0" y="421.0" font-size="12" fill="var(--ink)">+2,503, range 947 to 4,118 over 10 games. Kept.</text></g><g style="animation:e5 14.03s linear infinite"><g><rect x="450.4" y="375" width="220.6" height="18" rx="9.0" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="387" font-size="11" font-weight="650" fill="var(--c-keep)">KEPT · confirmed on fresh seeds</text></g></g><g style="animation:e6 14.03s linear infinite"><circle cx="374" cy="445" r="6.5" fill="var(--surface)" stroke="var(--c-revert)" stroke-width="3"/><g><rect x="400.0" y="438" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="450" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v3</text></g><g><rect x="437.2" y="438" width="154.6" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="450" font-size="11" font-weight="650" fill="var(--c-agent)">agent decides: revert</text></g><text x="601.8" y="450.0" font-size="12" fill="var(--ink)">refined heuristics and monotonicity</text><text x="400.0" y="467.0" font-size="12" fill="var(--ink2)">parent v2 · scores 5,938 on the public seeds (parent 4,838)</text></g><g style="animation:e7 14.03s linear infinite"><g><rect x="400.0" y="476" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="488" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="505.0" font-size="12" fill="var(--ink)">The agent reverted on its own after reading the gate's preview.</text><text x="400.0" y="519.0" font-size="11" fill="var(--ink3)">agent's note: noisy improvement, interval includes zero</text></g><g style="animation:e8 14.03s linear infinite"><g><rect x="450.4" y="476" width="214.0" height="18" rx="9.0" fill="var(--c-revert)" fill-opacity="0.13" stroke="var(--c-revert)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="488" font-size="11" font-weight="650" fill="var(--c-revert)">REVERTED · by the agent itself</text></g></g><g style="animation:e9 14.03s linear infinite"><circle cx="374" cy="543" r="6.5" fill="var(--surface)" stroke="var(--c-gate)" stroke-width="3"/><g><rect x="400.0" y="536" width="68.8" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="548" font-size="11" font-weight="650" fill="var(--c-gate)">finalize</text></g><text x="476.8" y="548.0" font-size="12" fill="var(--ink)">safety check passed. v2 stays as the head. submitted</text></g><g style="animation:e10 14.03s linear infinite"><text x="960.0" y="218.0" font-size="11" font-weight="700" fill="var(--ink3)">HIDDEN SEEDS, SCORED LATER</text><text x="960.0" y="233.0" font-size="11" fill="var(--ink3)">new version minus its parent, 16 seeds</text></g><g style="animation:e11 14.03s linear infinite"><text x="960.0" y="248.0" font-size="12.5" font-weight="650" class="mono" fill="var(--c-sealed)">+270 · 10 up, 6 down</text><text x="960.0" y="262.0" font-size="10.5" fill="var(--c-sealed)">this revert lost a real gain</text></g><g style="animation:e12 14.03s linear infinite"><text x="960.0" y="349.0" font-size="12.5" font-weight="650" class="mono" fill="var(--c-keep)">+1,364 · 13 up, 3 down</text><text x="960.0" y="363.0" font-size="10.5" fill="var(--c-keep)">the keep was right</text></g><g style="animation:e13 14.03s linear infinite"><text x="960.0" y="450.0" font-size="12.5" font-weight="650" class="mono" fill="var(--c-sealed)">+1,140 · 10 up, 5 down</text><text x="960.0" y="464.0" font-size="10.5" fill="var(--c-sealed)">this revert lost a real gain</text></g><g style="animation:e14 14.03s linear infinite"><text x="960.0" y="595.0" font-size="12" font-weight="650" fill="var(--ink)">submitted: v2</text><text x="960.0" y="611.0" font-size="12" font-weight="650" fill="var(--ink)">exam reward 0.0895</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 150" role="img" aria-label="Eight paired deltas with the bootstrap interval">
<style>
text { font: 9pt -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2933; }
.lbl { font-size: 8.5pt; } .small { font-size: 7.5pt; fill: #5f6b7a; } .title { font-size: 8.5pt; font-weight: 600; }
.rsi { fill: #eceff3; stroke: #6B7684; stroke-width: 1.3; }
.ours { fill: #dbe6fb; stroke: #3B6FD4; stroke-width: 1.5; }
.pp { fill: #fbe9d3; stroke: #C2731B; stroke-width: 1.5; }
.keep { fill: #ddf1e6; stroke: #1B7F5A; stroke-width: 1.5; }
.revert { fill: #f6dfd8; stroke: #B7472A; stroke-width: 1.5; }
.panel { fill: #fff; stroke: #d9dee5; }
.arrow { stroke: #1f2933; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
.arrowd { stroke: #5f6b7a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; marker-end: url(#ahm); }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker><marker id="ahm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="700" height="150" fill="#ffffff"/>
<line x1="60" y1="70" x2="660" y2="70" stroke="#d9dee5"/>
<line x1="193" y1="30" x2="193" y2="110" stroke="#8A94A6" stroke-dasharray="3 3"/><text x="193" y="124" text-anchor="middle" class="small">0</text>
<text x="60" y="124" text-anchor="middle" class="small">-400</text><text x="326" y="124" text-anchor="middle" class="small">+400</text><text x="460" y="124" text-anchor="middle" class="small">+800</text><text x="593" y="124" text-anchor="middle" class="small">+1200</text>
<g fill="#3B6FD4"><circle cx="630" cy="70" r="5"/><circle cx="467" cy="70" r="5"/><circle cx="330" cy="70" r="5"/><circle cx="260" cy="70" r="5"/><circle cx="213" cy="70" r="5"/><circle cx="130" cy="70" r="5"/><circle cx="93" cy="70" r="5"/><circle cx="117" cy="61" r="5"/></g>
<rect x="183" y="88" width="205" height="8" rx="2" fill="#3B6FD4" opacity="0.35"/><line x1="280" y1="84" x2="280" y2="100" stroke="#3B6FD4" stroke-width="2"/>
<text x="280" y="112" text-anchor="middle" class="small">mean +260; 90% interval from -30 to +584</text>
<text x="60" y="20" class="title">Eight paired deltas (candidate minus parent, one per seed, in game-score units)</text>
<text x="630" y="52" text-anchor="middle" class="small">+1310</text><text x="467" y="52" text-anchor="middle" class="small">+820</text><text x="112" y="46" text-anchor="middle" class="small">three seeds got worse</text>
</svg>

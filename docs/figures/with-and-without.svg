yle="animation:e29 16.1s linear infinite"><rect x="968" y="356" width="22" height="62" rx="3" fill="var(--c-keep)" fill-opacity="0.85"/><text x="998.0" y="408.0" font-size="10.5" fill="var(--ink3)">hidden games</text><text x="998.0" y="422.0" font-size="11.5" font-weight="650" fill="var(--c-keep)">its best version</text></g><g style="animation:e30 16.1s linear infinite"><text x="40.0" y="456.0" font-size="12.5" fill="var(--ink)">Two of the four keeps were luck. Alone, they stayed and everything after was built on them.</text></g><g style="animation:e31 16.1s linear infinite"><text x="40.0" y="474.0" font-size="12.5" fill="var(--ink)">With the gate, each ruling is written down with a fingerprint of the code and the games it ran on. Anyone can check it later.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 673" width="1200" height="673" role="img" aria-label="Now: the instrument checks every keep during the run."><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-agent:#6b6a63;--c-sealed:#C2731B;--c-within:#78776f;--c-version:#52514e;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-agent:#a3a29a;--c-sealed:#e39a4a;--c-within:#93928a;--c-version:#c3c2b7;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}</style><rect width="1200" height="673" fill="var(--surface)"/><text x="44.0" y="72.0" font-size="26" font-weight="700" fill="var(--ink)">Now: the instrument checks every keep during the run.</text><text x="44.0" y="100.0" font-size="13.5" fill="var(--ink2)">claude-opus-5 under the instrument, 2026-09-10. The agent still writes the versions and still decides what to try next. What changes is</text><text x="44.0" y="119.0" font-size="13.5" fill="var(--ink2)">that a keep only sticks once it has been measured.</text><text x="44" y="150" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">HOW TO READ THIS</text><text x="44.0" y="170.0" font-size="12.5" fill="var(--ink)">1  The agent writes a new version, scores it on the 8 public seeds, and proposes to keep it.</text><text x="44.0" y="188.0" font-size="12.5" fill="var(--ink)">2  The gate checks the improvement on those seeds, then on fresh seeds the agent never saw.</text><text x="44.0" y="206.0" font-size="12.5" fill="var(--ink)">3  Only a confirmed improvement stays. Every ruling is logged. A safety check runs before submission.</text><rect x="44" y="222" width="300" height="363" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.25"/><text x="64" y="250" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">ONE REAL ROLLOUT</text><text x="64.0" y="274.0" font-size="14" font-weight="650" fill="var(--ink)">Opus trial under the instrument</text><text x="64.0" y="298.0" font-size="12" fill="var(--ink2)">claude-opus-5 · 2026-09-10</text><text x="64.0" y="315.0" font-size="12" fill="var(--ink2)">the instrument. helper and gate mounted</text><text x="64.0" y="332.0" font-size="12" fill="var(--ink2)">read-only</text><text x="64.0" y="349.0" font-size="12" fill="var(--ink2)">32-minute window. finished on its own at</text><text x="64.0" y="366.0" font-size="12" fill="var(--ink2)">25 min</text><line x1="64" y1="395" x2="324" y2="395" stroke="var(--line)"/><text x="64" y="415" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">IN NUMBERS</text><text x="64.0" y="441.0" font-size="12" fill="var(--ink)">keeps the agent asked for</text><text x="324.0" y="441.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2</text><text x="64.0" y="465.0" font-size="12" fill="var(--ink)">confirmed on fresh seeds</text><text x="324.0" y="465.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2</text><text x="64.0" y="489.0" font-size="12" fill="var(--ink)">overruled by the gate</text><text x="324.0" y="489.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">0</text><text x="64.0" y="513.0" font-size="12" fill="var(--ink)">reverted by the agent itself</text><text x="324.0" y="513.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">1</text><text x="64.0" y="537.0" font-size="12" fill="var(--ink)">rulings in the decision log</text><text x="324.0" y="537.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">2</text><text x="64.0" y="561.0" font-size="12" fill="var(--ink)">record verified offline</text><text x="324.0" y="561.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">yes</text><line x1="374" y1="222" x2="374" y2="603" stroke="var(--line)" stroke-width="2"/><text x="44.0" y="643.0" font-size="11.5" fill="var(--ink3)">Every row is an event from the rollout's own files. The plain line under each ruling is rendered from the recorded fields. The hidden seeds are</text><text x="44.0" y="658.0" font-size="11.5" fill="var(--ink3)">analysis data and never tune the rule.</text><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="374" cy="243" r="6.5" fill="var(--surface)" stroke="var(--c-keep)" stroke-width="3"/><g><rect x="400.0" y="236" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="248" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v1</text></g><g><rect x="437.2" y="236" width="148.0" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="248" font-size="11" font-weight="650" fill="var(--c-agent)">agent proposes: keep</text></g><text x="595.2" y="248.0" font-size="12" fill="var(--ink)">bitboard expectimax depth 2 with nneonneo row heuristic</text><text x="400.0" y="265.0" font-size="12" fill="var(--ink2)">parent v0 · scores 38,974 on the public seeds (parent 2,060)</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="400.0" y="274" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="286" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="303.0" font-size="12" fill="var(--ink)">Better on the practice games. Confirmed on fresh games the agent never saw. Mean</text><text x="400.0" y="320.0" font-size="12" fill="var(--ink)">+32,800, range 21,510 to 44,029 over 8 games. Kept.</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="450.4" y="274" width="220.6" height="18" rx="9.0" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="286" font-size="11" font-weight="650" fill="var(--c-keep)">KEPT · confirmed on fresh seeds</text></g></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="374" cy="344" r="6.5" fill="var(--surface)" stroke="var(--c-revert)" stroke-width="3"/><g><rect x="400.0" y="337" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="349" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v2</text></g><g><rect x="437.2" y="337" width="154.6" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="349" font-size="11" font-weight="650" fill="var(--c-agent)">agent decides: revert</text></g><text x="601.8" y="349.0" font-size="12" fill="var(--ink)">depth-3 expectimax with 1e-4 probability cutoff and…</text><text x="400.0" y="366.0" font-size="12" fill="var(--ink2)">parent v1 · scores 48,115 on the public seeds (parent 38,974)</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="400.0" y="375" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="387" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="404.0" font-size="12" fill="var(--ink)">The agent reverted on its own after reading the gate's preview.</text><text x="400.0" y="418.0" font-size="11" fill="var(--ink3)">agent's note: real +9k but 8-seed noise cannot confirm; superseded by adaptive-depth candidate</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="450.4" y="375" width="214.0" height="18" rx="9.0" fill="var(--c-revert)" fill-opacity="0.13" stroke="var(--c-revert)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="387" font-size="11" font-weight="650" fill="var(--c-revert)">REVERTED · by the agent itself</text></g></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="374" cy="442" r="6.5" fill="var(--surface)" stroke="var(--c-keep)" stroke-width="3"/><g><rect x="400.0" y="435" width="29.2" height="18" rx="9.0" fill="var(--c-version)" fill-opacity="0.13" stroke="var(--c-version)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="447" font-size="11" font-weight="650" class="mono" fill="var(--c-version)">v3</text></g><g><rect x="437.2" y="435" width="148.0" height="18" rx="9.0" fill="var(--c-agent)" fill-opacity="0.13" stroke="var(--c-agent)" stroke-opacity="0.6" stroke-width="1"/><text x="445.2" y="447" font-size="11" font-weight="650" fill="var(--c-agent)">agent proposes: keep</text></g><text x="595.2" y="447.0" font-size="12" fill="var(--ink)">tiered depth: 2 when &gt;5 empties, 3 when 3-5, 4 when…</text><text x="400.0" y="464.0" font-size="12" fill="var(--ink2)">parent v1 · scores 89,318 on the public seeds (parent 38,974)</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="400.0" y="473" width="42.4" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="485" font-size="11" font-weight="650" fill="var(--c-gate)">gate</text></g><text x="400.0" y="502.0" font-size="12" fill="var(--ink)">Better on the practice games. Confirmed on fresh games the agent never saw. Mean</text><text x="400.0" y="519.0" font-size="12" fill="var(--ink)">+57,097, range 28,840 to 88,737 over 8 games. Kept.</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><g><rect x="450.4" y="473" width="220.6" height="18" rx="9.0" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6" stroke-width="1"/><text x="458.4" y="485" font-size="11" font-weight="650" fill="var(--c-keep)">KEPT · confirmed on fresh seeds</text></g></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="374" cy="543" r="6.5" fill="var(--surface)" stroke="var(--c-gate)" stroke-width="3"/><g><rect x="400.0" y="536" width="68.8" height="18" rx="9.0" fill="var(--c-gate)" fill-opacity="0.13" stroke="var(--c-gate)" stroke-opacity="0.6" stroke-width="1"/><text x="408.0" y="548" font-size="11" font-weight="650" fill="var(--c-gate)">finalize</text></g><text x="476.8" y="548.0" font-size="12" fill="var(--ink)">safety check passed. v3 stays as the head. submitted</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="960.0" y="595.0" font-size="12" font-weight="650" fill="var(--ink)">submitted: v3</text><text x="960.0" y="611.0" font-size="12" font-weight="650" fill="var(--ink)">exam reward 0.5511</text><text x="960.0" y="627.0" font-size="10.5" fill="var(--ink3)">hidden-seed column: not scored yet</text></g></svg>
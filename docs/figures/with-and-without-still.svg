<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 500" width="1320" height="500" role="img" aria-label="An agent improving a program alone, and the same tries with the gate"><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-warn:#C2731B;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-warn:#e39a4a;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}</style><rect width="1320" height="500" fill="var(--surface)"/><text x="40.0" y="52.0" font-size="25" font-weight="700" fill="var(--ink)">The same agent, the same four tries. Alone, and with the gate.</text><text x="40.0" y="78.0" font-size="13" fill="var(--ink2)">The agent has a few hours to improve a program. It can only score itself on practice games it sees again and again.</text><text x="40.0" y="96.0" font-size="13" fill="var(--ink2)">The final exam is on hidden games. Fresh games are new ones the gate draws to check a claim. An illustration, not a measured run.</text><text x="40.0" y="134.0" font-size="11" font-weight="700" fill="var(--ink3)">ALONE</text><text x="40.0" y="152.0" font-size="11" fill="var(--ink3)">keeps what looks better</text><line x1="234" y1="188" x2="1280" y2="188" stroke="var(--line)" stroke-width="2"/><path d="M 1272 183 L 1280 188 L 1272 193" fill="none" stroke="var(--line)" stroke-width="2"/><text x="40.0" y="326.0" font-size="11" font-weight="700" fill="var(--ink3)">WITH THE GATE</text><text x="40.0" y="344.0" font-size="11" fill="var(--ink3)">keeps only what fresh games confirm</text><line x1="234" y1="380" x2="1280" y2="380" stroke="var(--line)" stroke-width="2"/><path d="M 1272 375 L 1280 380 L 1272 385" fill="none" stroke="var(--line)" stroke-width="2"/><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="250" y="116" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="262.0" y="138.0" font-size="12" font-weight="650" fill="var(--ink)">Try 1. a smarter search</text><text x="262.0" y="158.0" font-size="11.5" fill="var(--ink2)">practice games. better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="262.0" y="172" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="270.0" y="184" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="250" y="308" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="262.0" y="330.0" font-size="12" font-weight="650" fill="var(--ink)">Try 1. a smarter search</text><text x="262.0" y="350.0" font-size="11.5" fill="var(--ink2)">practice games. better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="262.0" y="370.0" font-size="11.5" font-weight="650" fill="var(--c-gate)">fresh games agree</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="262.0" y="384" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="270.0" y="396" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="350.0" y="296.0" font-size="10" text-anchor="middle" fill="var(--ink3)">same try</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="464" y="116" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="476.0" y="138.0" font-size="12" font-weight="650" fill="var(--ink)">Try 2. a small tweak</text><text x="476.0" y="158.0" font-size="11.5" fill="var(--ink2)">practice games. a bit better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="476.0" y="172" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="484.0" y="184" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="476.0" y="212.0" font-size="11" font-weight="650" fill="var(--c-warn)">hidden games say worse</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="464" y="308" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="476.0" y="330.0" font-size="12" font-weight="650" fill="var(--ink)">Try 2. a small tweak</text><text x="476.0" y="350.0" font-size="11.5" fill="var(--ink2)">practice games. a bit better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="476.0" y="370.0" font-size="11.5" font-weight="650" fill="var(--c-gate)">fresh games say no</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="476.0" y="384" width="88.6" height="18" rx="9" fill="var(--c-revert)" fill-opacity="0.13" stroke="var(--c-revert)" stroke-opacity="0.6"/><text x="484.0" y="396" font-size="11" font-weight="650" fill="var(--c-revert)">thrown away</text><line x1="470" y1="314" x2="658" y2="414" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="658" y1="314" x2="470" y2="414" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="564.0" y="296.0" font-size="10" text-anchor="middle" fill="var(--ink3)">same try</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="678" y="116" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="690.0" y="138.0" font-size="12" font-weight="650" fill="var(--ink)">Try 3. a shortcut</text><text x="690.0" y="158.0" font-size="11.5" fill="var(--ink2)">practice games. better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="690.0" y="172" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="698.0" y="184" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="690.0" y="212.0" font-size="11" font-weight="650" fill="var(--c-warn)">hidden games say worse</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="678" y="308" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="690.0" y="330.0" font-size="12" font-weight="650" fill="var(--ink)">Try 3. a shortcut</text><text x="690.0" y="350.0" font-size="11.5" fill="var(--ink2)">practice games. better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="690.0" y="370.0" font-size="11.5" font-weight="650" fill="var(--c-gate)">fresh games say no</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="690.0" y="384" width="88.6" height="18" rx="9" fill="var(--c-revert)" fill-opacity="0.13" stroke="var(--c-revert)" stroke-opacity="0.6"/><text x="698.0" y="396" font-size="11" font-weight="650" fill="var(--c-revert)">thrown away</text><line x1="684" y1="314" x2="872" y2="414" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="872" y1="314" x2="684" y2="414" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="778.0" y="296.0" font-size="10" text-anchor="middle" fill="var(--ink3)">same try</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="892" y="116" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="904.0" y="138.0" font-size="12" font-weight="650" fill="var(--ink)">Try 4. a deeper search</text><text x="904.0" y="158.0" font-size="11.5" fill="var(--ink2)">practice games. much better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="904.0" y="172" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="912.0" y="184" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="892" y="308" width="200" height="112" rx="10" fill="var(--card)" stroke="var(--line)"/><text x="904.0" y="330.0" font-size="12" font-weight="650" fill="var(--ink)">Try 4. a deeper search</text><text x="904.0" y="350.0" font-size="11.5" fill="var(--ink2)">practice games. much better</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="904.0" y="370.0" font-size="11.5" font-weight="650" fill="var(--c-gate)">fresh games agree</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="904.0" y="384" width="42.4" height="18" rx="9" fill="var(--c-keep)" fill-opacity="0.13" stroke="var(--c-keep)" stroke-opacity="0.6"/><text x="912.0" y="396" font-size="11" font-weight="650" fill="var(--c-keep)">kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="992.0" y="296.0" font-size="10" text-anchor="middle" fill="var(--ink3)">same try</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1112.0" y="138.0" font-size="12" font-weight="650" fill="var(--ink)">Time is up</text><text x="1112.0" y="158.0" font-size="11.5" fill="var(--ink2)">submits the last version</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1112.0" y="330.0" font-size="12" font-weight="650" fill="var(--ink)">Time is up</text><text x="1112.0" y="350.0" font-size="11.5" fill="var(--ink2)">safety check, then submits</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="1112" y="196" width="22" height="30" rx="3" fill="var(--c-warn)" fill-opacity="0.85"/><text x="1142.0" y="216.0" font-size="10.5" fill="var(--ink3)">hidden games</text><text x="1142.0" y="230.0" font-size="11.5" font-weight="650" fill="var(--c-warn)">worse than try 1</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><rect x="1112" y="356" width="22" height="62" rx="3" fill="var(--c-keep)" fill-opacity="0.85"/><text x="1142.0" y="408.0" font-size="10.5" fill="var(--ink3)">hidden games</text><text x="1142.0" y="422.0" font-size="11.5" font-weight="650" fill="var(--c-keep)">its best version</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="456.0" font-size="12.5" fill="var(--ink)">Two of the four keeps were luck. Alone, they stayed and everything after was built on them.</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="474.0" font-size="12.5" fill="var(--ink)">With the gate, each ruling is written down with a fingerprint of the code and the games it ran on. Anyone can check it later.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 634" width="1200" height="634" role="img" aria-label="Before: the agent decided alone; the record could only report afterwards."><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-agent:#6b6a63;--c-sealed:#C2731B;--c-within:#78776f;--c-version:#52514e;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-agent:#a3a29a;--c-sealed:#e39a4a;--c-within:#93928a;--c-version:#c3c2b7;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}</style><rect width="1200" height="634" fill="var(--surface)"/><text x="44.0" y="72.0" font-size="26" font-weight="700" fill="var(--ink)">Before: the agent decided alone; the record could only report afterwards.</text><text x="44.0" y="100.0" font-size="13.5" fill="var(--ink2)">claude-haiku-4-5 under the exam's own program, no helper, 2026-09-07. Each version the agent kept became the new starting point for the</text><text x="44.0" y="119.0" font-size="13.5" fill="var(--ink2)">next one. Nobody checked it during the run.</text><text x="44" y="150" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">HOW TO READ THIS</text><text x="44.0" y="170.0" font-size="12.5" fill="var(--ink)">1  The agent writes a new version and decides on its own to keep it.</text><text x="44.0" y="188.0" font-size="12.5" fill="var(--ink)">2  Nothing checks that decision while the run is going. The record only writes it down.</text><text x="44.0" y="206.0" font-size="12.5" fill="var(--ink)">3  After the run, the hidden seeds show which keeps actually made the policy worse.</text><rect x="44" y="222" width="300" height="346" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="1.25"/><text x="64" y="250" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">ONE REAL ROLLOUT</text><text x="64.0" y="274.0" font-size="14" font-weight="650" fill="var(--ink)">Haiku, the exam's own program</text><text x="64.0" y="298.0" font-size="12" fill="var(--ink2)">claude-haiku-4-5 · 2026-09-07</text><text x="64.0" y="315.0" font-size="12" fill="var(--ink2)">the exam's own program, no helper</text><text x="64.0" y="332.0" font-size="12" fill="var(--ink2)">10-minute agent budget. finished on its</text><text x="64.0" y="349.0" font-size="12" fill="var(--ink2)">own at 8.3 min</text><line x1="64" y1="378" x2="324" y2="378" stroke="var(--line)"/><text x="64" y="398" font-size="11" font-weight="700" fill="var(--ink3)" letter-spacing="1.2">IN NUMBERS</text><text x="64.0" y="424.0" font-size="12" fill="var(--ink)">decisions the agent made</text><text x="324.0" y="424.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">10</text><text x="64.0" y="448.0" font-size="12" fill="var(--ink)">kept or submitted</text><text x="324.0" y="448.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">10</text><text x="64.0" y="472.0" font-size="12" fill="var(--ink)">reverted</text><text x="324.0" y="472.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">0</text><text x="64.0" y="496.0" font-size="12" fill="var(--ink)">checked during the run</text><text x="324.0" y="496.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">0</text><text x="64.0" y="520.0" font-size="12" fill="var(--ink)">record verified offline</text><text x="324.0" y="520.0" font-size="12.5" font-weight="650" class="mono" text-anchor="end" fill="var(--ink2)">yes</text><text x="64.0" y="544.0" font-size="12" fill="var(--ink)">keeps that made it worse</text><text x="324.0" y="544.0" font-size="12.5" font-weight="650" 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="RSI-Exam rollout anatomy">
<style>
text { font: 9pt -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2933; }
.lbl { font-size: 8.5pt; } .small { font-size: 7.5pt; fill: #5f6b7a; } .title { font-size: 8.5pt; font-weight: 600; }
.rsi { fill: #eceff3; stroke: #6B7684; stroke-width: 1.3; }
.ours { fill: #dbe6fb; stroke: #3B6FD4; stroke-width: 1.5; }
.pp { fill: #fbe9d3; stroke: #C2731B; stroke-width: 1.5; }
.keep { fill: #ddf1e6; stroke: #1B7F5A; stroke-width: 1.5; }
.revert { fill: #f6dfd8; stroke: #B7472A; stroke-width: 1.5; }
.panel { fill: #fff; stroke: #d9dee5; }
.arrow { stroke: #1f2933; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
.arrowd { stroke: #5f6b7a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; marker-end: url(#ahm); }
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2933"/></marker><marker id="ahm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/></marker></defs>
<rect x="0" y="0" width="700" height="300" fill="#ffffff"/>
<rect x="10" y="20" width="440" height="222" rx="6" class="panel"/>
<text x="20" y="38" class="title">Inside the sandbox (no network, up to 12 h): the agent's loop</text>
<rect x="24" y="52" width="130" height="48" rx="4" class="rsi"/>
<text x="89.0" y="70" text-anchor="middle" class="lbl">methods/main/</text>
<text x="89.0" y="84" text-anchor="middle" class="small">policy.py, the method</text>
<rect x="176" y="52" width="150" height="48" rx="4" class="rsi"/>
<text x="251.0" y="70" text-anchor="middle" class="lbl">selfcheck.py</text>
<text x="251.0" y="84" text-anchor="middle" class="small">8 visible seeds, one score each</text>
<rect x="348" y="52" width="90" height="48" rx="4" class="rsi"/>
<text x="393.0" y="70" text-anchor="middle" class="lbl">visible_result</text>
<text x="393.0" y="84" text-anchor="middle" class="small">.json</text>
<path d="M154,76 L174,76" class="arrow"/><path d="M326,76 L346,76" class="arrow"/>
<rect x="24" y="132" width="190" height="60" rx="4" class="rsi"/>
<text x="119.0" y="150" text-anchor="middle" class="lbl">experiment_log.md</text>
<text x="119.0" y="164" text-anchor="middle" class="small">one line per version:</text>
<text x="119.0" y="177" text-anchor="middle" class="small">parent, score, kept or reverted</text>
<rect x="244" y="132" width="190" height="60" rx="4" class="rsi"/>
<text x="339.0" y="150" text-anchor="middle" class="lbl">versions/vN/</text>
<text x="339.0" y="164" text-anchor="middle" class="small">a snapshot of main/</text>
<text x="339.0" y="177" text-anchor="middle" class="small">for every logged version</text>
<path d="M89,100 L89,130" class="arrow"/><path d="M393,100 L393,130" class="arrow"/>
<path d="M244,162 L214,162" class="arrowd"/>
<text x="24" y="216" class="small">A revert restores main/ from a snapshot. A keep makes vN the parent of everything that follows.</text>
<text x="24" y="230" class="small">Dashed: the log line names the snapshot it describes.</text>
<rect x="466" y="20" width="224" height="222" rx="6" class="panel"/>
<text x="476" y="38" class="title">After the run: the job directory</text>
<rect x="480" y="52" width="196" height="46" rx="4" class="rsi"/>
<text x="578.0" y="70" text-anchor="middle" class="lbl">artifacts/app/methods/</text>
<text x="578.0" y="84" text-anchor="middle" class="small">main, versions, log, results</text>
<rect x="480" y="108" width="196" height="46" rx="4" class="rsi"/>
<text x="578.0" y="126" text-anchor="middle" class="lbl">agent/trajectory.json</text>
<text x="578.0" y="140" text-anchor="middle" class="small">full transcript, bound by digest</text>
<rect x="480" y="164" width="196" height="60" rx="4" class="rsi"/>
<text x="578.0" y="182" text-anchor="middle" class="lbl">verifier/reward.json</text>
<text x="578.0" y="196" text-anchor="middle" class="small">sealed grader: 16 seeds,</text>
<text x="578.0" y="209" text-anchor="middle" class="small">reward from 0 to 1</text>
<path d="M450,131 L464,131" class="arrow"/>
<text x="20" y="266" class="small">Only Python files may live under main/ (anything else scores 0.0); bytecode caches are ignored by the grader.</text>
<rect x="20" y="279" width="11" height="11" rx="2" class="rsi"/>
<text x="36" y="288" class="small">RSI-Exam, unchanged</text>
</svg>

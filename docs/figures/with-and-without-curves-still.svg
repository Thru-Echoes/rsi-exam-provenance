<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 660" width="1320" height="660" role="img" aria-label="Two charts, what the agent sees on practice games and what the hidden games would say, alone and with the gate"><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-warn:#C2731B;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-warn:#e39a4a;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}</style><rect width="1320" height="660" fill="var(--surface)"/><text x="40.0" y="52.0" font-size="25" font-weight="700" fill="var(--ink)">What the agent sees, and what is real.</text><text x="40.0" y="78.0" font-size="13" fill="var(--ink2)">Grey. the score on the practice games, the only number the agent can see. Colour. what the hidden games would say at that moment.</text><text x="40.0" y="96.0" font-size="13" fill="var(--ink2)">Alone, the two drift apart at every lucky keep. With the gate, a try the fresh games reject never moves either line.</text><text x="40.0" y="156.0" font-size="11" font-weight="700" fill="var(--ink3)">ALONE</text><text x="40.0" y="174.0" font-size="11" fill="var(--ink3)">keeps what looks better</text><line x1="250" y1="330" x2="1210" y2="330" stroke="var(--line)" stroke-width="2"/><line x1="250" y1="144" x2="250" y2="330" stroke="var(--line)" stroke-width="2"/><text x="244.0" y="154.0" font-size="10.5" text-anchor="end" fill="var(--ink3)">score</text><text x="416.7" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 1</text><text x="573.3" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 2</text><text x="730.0" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 3</text><text x="886.7" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 4</text><text x="1043.3" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 5</text><text x="1200.0" y="346.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 6</text><text x="40.0" y="396.0" font-size="11" font-weight="700" fill="var(--ink3)">WITH THE GATE</text><text x="40.0" y="414.0" font-size="11" fill="var(--ink3)">keeps only what fresh games confirm</text><line x1="250" y1="570" x2="1210" y2="570" stroke="var(--line)" stroke-width="2"/><line x1="250" y1="384" x2="250" y2="570" stroke="var(--line)" stroke-width="2"/><text x="244.0" y="394.0" font-size="10.5" text-anchor="end" fill="var(--ink3)">score</text><text x="416.7" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 1</text><text x="573.3" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 2</text><text x="730.0" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 3</text><text x="886.7" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 4</text><text x="1043.3" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 5</text><text x="1200.0" y="586.0" font-size="10.5" text-anchor="middle" fill="var(--ink3)">try 6</text><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="260.0" y1="312.0" x2="416.7" y2="267.0" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="260.0" y1="312.0" x2="416.7" y2="267.0" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="416.7" cy="267.0" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="260.0" y1="552.0" x2="416.7" y2="507.0" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="260.0" y1="552.0" x2="416.7" y2="507.0" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="416.7" cy="507.0" r="9" fill="var(--c-keep)"/><text x="416.7" y="491.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">confirmed</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="416.7" y1="267.0" x2="573.3" y2="254.4" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="416.7" y1="267.0" x2="573.3" y2="276.0" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="573.3" cy="254.4" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="416.7" y1="507.0" x2="573.3" y2="507.0" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="416.7" y1="507.0" x2="573.3" y2="507.0" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="563.3333333333333" y1="457.0" x2="583.3333333333333" y2="477.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="583.3333333333333" y1="457.0" x2="563.3333333333333" y2="477.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="573.3" y="443.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="573.3" y1="254.4" x2="730.0" y2="240.0" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="573.3" y1="276.0" x2="730.0" y2="290.4" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="730.0" cy="240.0" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="573.3" y1="507.0" x2="730.0" y2="507.0" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="573.3" y1="507.0" x2="730.0" y2="507.0" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="720.0" y1="457.0" x2="740.0" y2="477.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="740.0" y1="457.0" x2="720.0" y2="477.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="730.0" y="443.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="730.0" y1="240.0" x2="886.7" y2="200.4" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="730.0" y1="290.4" x2="886.7" y2="243.6" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="886.7" cy="200.4" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="730.0" y1="507.0" x2="886.7" y2="447.6" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="730.0" y1="507.0" x2="886.7" y2="458.4" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="886.7" cy="447.6" r="9" fill="var(--c-keep)"/><text x="886.7" y="431.6" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">confirmed</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="886.7" y1="200.4" x2="1043.3" y2="189.6" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="886.7" y1="243.6" x2="1043.3" y2="254.4" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="1043.3" cy="189.6" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="886.7" y1="447.6" x2="1043.3" y2="447.6" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="886.7" y1="458.4" x2="1043.3" y2="458.4" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="1033.3333333333335" y1="397.6" x2="1053.3333333333335" y2="417.6" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="1053.3333333333335" y1="397.6" x2="1033.3333333333335" y2="417.6" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="1043.3" y="383.6" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="1043.3" y1="189.6" x2="1200.0" y2="175.2" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="1043.3" y1="254.4" x2="1200.0" y2="236.4" stroke="var(--c-warn)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="1200.0" cy="175.2" r="7" fill="var(--ink3)"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="1043.3" y1="447.6" x2="1200.0" y2="422.4" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="6 5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="1043.3" y1="458.4" x2="1200.0" y2="433.2" stroke="var(--c-keep)" stroke-width="3.5"/></g><g style="opacity:1.00;transform:translateX(-0.0px)"><circle cx="1200.0" cy="422.4" r="9" fill="var(--c-keep)"/><text x="1200.0" y="406.4" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">confirmed</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1214.0" y="175.2" font-size="10.5" fill="var(--ink3)">what it sees</text><text x="1214.0" y="244.4" font-size="10.5" font-weight="650" fill="var(--c-warn)">what is real</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1214.0" y="418.4" font-size="10.5" fill="var(--ink3)">what it sees</text><text x="1214.0" y="445.2" font-size="10.5" font-weight="650" fill="var(--c-keep)">what is real</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="616.0" font-size="12.5" fill="var(--ink)">Alone, the agent watches its number climb while the real score slips at every lucky keep.</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="634.0" font-size="12.5" fill="var(--ink)">With the gate, the lines stay together, because a keep only sticks when fresh games agree. Each ruling carries a fingerprint of the code.</text></g></svg>
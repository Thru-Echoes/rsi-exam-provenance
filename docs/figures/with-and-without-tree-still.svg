<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" width="1320" height="600" role="img" aria-label="The same six tries as a chain when the agent decides alone, and as a pruned tree under the gate"><style>:root{--surface:#fcfcfb;--card:#ffffff;--line:#e4e3de;--ink:#0b0b0b;--ink2:#52514e;--ink3:#78776f;--c-keep:#1B7F5A;--c-revert:#B7472A;--c-gate:#3B6FD4;--c-warn:#C2731B;}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--card:#232322;--line:#3a3a37;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#93928a;--c-keep:#2fb37f;--c-revert:#e0684a;--c-gate:#5b8fe6;--c-warn:#e39a4a;}}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}</style><rect width="1320" height="600" fill="var(--surface)"/><text x="40.0" y="52.0" font-size="25" font-weight="700" fill="var(--ink)">Six tries. Alone they chain. With the gate, the bad ones get pruned.</text><text x="40.0" y="78.0" font-size="13" fill="var(--ink2)">Every try starts from the version the agent currently trusts. Alone, that is always the last one it kept.</text><text x="40.0" y="96.0" font-size="13" fill="var(--ink2)">With the gate, a try the fresh games reject is thrown away, and the next try starts again from the last confirmed version.</text><text x="40.0" y="128.0" font-size="11" font-weight="700" fill="var(--ink3)">ALONE</text><text x="40.0" y="146.0" font-size="11" fill="var(--ink3)">one long chain</text><text x="40.0" y="360.0" font-size="11" font-weight="700" fill="var(--ink3)">WITH THE GATE</text><text x="40.0" y="378.0" font-size="11" fill="var(--ink3)">a tree with pruned branches</text><rect x="202" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-gate)" stroke-width="2"/><text x="212.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Start</text><text x="212.0" y="181.0" font-size="10.5" fill="var(--ink2)">the weak program</text><rect x="202" y="377.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-gate)" stroke-width="2"/><text x="212.0" y="396.0" font-size="11.5" font-weight="650" fill="var(--ink)">Start</text><text x="212.0" y="413.0" font-size="10.5" fill="var(--ink2)">the weak program</text><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 352 168 C 392 168, 294 168, 334 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="334" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="344.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 1</text><text x="344.0" y="181.0" font-size="10.5" fill="var(--ink2)">a smarter search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 484 168 C 524 168, 426 168, 466 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="466" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="476.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 2</text><text x="476.0" y="181.0" font-size="10.5" fill="var(--ink2)">a small tweak</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="541.0" y="212.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-warn)">hidden games. worse</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 616 168 C 656 168, 558 168, 598 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="598" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="608.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 3</text><text x="608.0" y="181.0" font-size="10.5" fill="var(--ink2)">a shortcut</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="673.0" y="212.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-warn)">hidden games. worse</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 748 168 C 788 168, 690 168, 730 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="730" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="740.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 4</text><text x="740.0" y="181.0" font-size="10.5" fill="var(--ink2)">a deeper search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 880 168 C 920 168, 822 168, 862 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="862" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="872.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 5</text><text x="872.0" y="181.0" font-size="10.5" fill="var(--ink2)">bigger tables</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="937.0" y="212.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-warn)">hidden games. worse</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 1012 168 C 1052 168, 954 168, 994 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="994" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="1004.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 6</text><text x="1004.0" y="181.0" font-size="10.5" fill="var(--ink2)">tuned search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 352 400 C 392 400, 294 400, 334 400" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="334" y="377.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="344.0" y="396.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 1</text><text x="344.0" y="413.0" font-size="10.5" fill="var(--ink2)">a smarter search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="409.0" y="444.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">fresh games agree. kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 484 400 C 524 400, 426 308, 466 308" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="466" y="285.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-revert)" stroke-width="2"/><text x="476.0" y="304.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 2</text><text x="476.0" y="321.0" font-size="10.5" fill="var(--ink2)">a small tweak</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="472" y1="291.0" x2="610" y2="325.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="610" y1="291.0" x2="472" y2="325.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="541.0" y="274.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no. thrown away</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 484 400 C 524 400, 558 492, 598 492" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="598" y="469.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-revert)" stroke-width="2"/><text x="608.0" y="488.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 3</text><text x="608.0" y="505.0" font-size="10.5" fill="var(--ink2)">a shortcut</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="604" y1="475.0" x2="742" y2="509.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="742" y1="475.0" x2="604" y2="509.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="673.0" y="536.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no. thrown away</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 484 400 C 524 400, 690 400, 730 400" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="730" y="377.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="740.0" y="396.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 4</text><text x="740.0" y="413.0" font-size="10.5" fill="var(--ink2)">a deeper search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="805.0" y="444.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">fresh games agree. kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 880 400 C 920 400, 822 308, 862 308" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="862" y="285.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-revert)" stroke-width="2"/><text x="872.0" y="304.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 5</text><text x="872.0" y="321.0" font-size="10.5" fill="var(--ink2)">bigger tables</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><line x1="868" y1="291.0" x2="1006" y2="325.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><line x1="1006" y1="291.0" x2="868" y2="325.0" stroke="var(--c-revert)" stroke-width="7" stroke-linecap="round" opacity="0.9"/><text x="937.0" y="274.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-revert)">fresh games say no. thrown away</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 880 400 C 920 400, 954 400, 994 400" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="994" y="377.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-keep)" stroke-width="2"/><text x="1004.0" y="396.0" font-size="11.5" font-weight="650" fill="var(--ink)">Try 6</text><text x="1004.0" y="413.0" font-size="10.5" fill="var(--ink2)">tuned search</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1069.0" y="444.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">fresh games agree. kept</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 1144 168 C 1184 168, 1086 168, 1126 168" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="1126" y="145.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-gate)" stroke-width="2"/><text x="1136.0" y="164.0" font-size="11.5" font-weight="650" fill="var(--ink)">Submit</text><text x="1136.0" y="181.0" font-size="10.5" fill="var(--ink2)">time is up</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><path d="M 1144 400 C 1184 400, 1086 400, 1126 400" fill="none" stroke="var(--line)" stroke-width="2.5"/><rect x="1126" y="377.0" width="150" height="46" rx="9" fill="var(--card)" stroke="var(--c-gate)" stroke-width="2"/><text x="1136.0" y="396.0" font-size="11.5" font-weight="650" fill="var(--ink)">Submit</text><text x="1136.0" y="413.0" font-size="10.5" fill="var(--ink2)">time is up</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1201.0" y="134.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-warn)">hidden games. worse than try 4</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="1201.0" y="366.0" font-size="10.5" font-weight="650" text-anchor="middle" fill="var(--c-keep)">hidden games. its best version</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="556.0" font-size="12.5" fill="var(--ink)">Alone, three of the six keeps were luck, and tries 5 and 6 were built on top of them.</text></g><g style="opacity:1.00;transform:translateX(-0.0px)"><text x="40.0" y="574.0" font-size="12.5" fill="var(--ink)">With the gate, the three bad tries never became anyone's parent. Every ruling is written down with a fingerprint of the code.</text></g></svg>